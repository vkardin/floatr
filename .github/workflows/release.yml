name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build archives
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: aloft-packages
          path: dist/*.zip
      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Aloft ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
